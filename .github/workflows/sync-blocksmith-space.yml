name: Deploy BlockSmith to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - '.github/workflows/sync-blocksmith-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocksmith-huggingface-deploy
  cancel-in-progress: true

env:
  HF_REPO_ID: RespawnerzStudioz/BlockSmith-Minecraft

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: space/requirements.txt

      - name: Install and test BlockSmith
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r space/requirements.txt pytest
          python -m pip install --upgrade huggingface_hub
          python -m py_compile space/app.py space/minecraft_builder.py space/test_builder.py
          PYTHONPATH=space pytest -q space/test_builder.py
          PYTHONPATH=space python -c "import app; print('BlockSmith Gradio app imported successfully')"

          # Exercise the same queue + launch path used by the Space, but do not block CI.
          PYTHONPATH=space python - <<'PY'
          import app
          app.demo.queue(default_concurrency_limit=2).launch(
              css=app.CSS,
              js=app.JS,
              server_name="127.0.0.1",
              server_port=7861,
              prevent_thread_lock=True,
              show_error=True,
              quiet=True,
          )
          app.demo.close()
          print("BlockSmith Gradio launch smoke test passed")
          PY

      - name: Verify Hugging Face authentication
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::Repository secret HF_TOKEN is missing."
            exit 1
          fi
          hf auth whoami

      - name: Create or configure free ZeroGPU Space
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          hf repos create "$HF_REPO_ID" \
            --repo-type space \
            --sdk gradio \
            --flavor zero-a10g \
            --public \
            --exist-ok

          # Keep an already-created Space on the free ZeroGPU tier too.
          hf spaces settings "$HF_REPO_ID" --hardware zero-a10g

      - name: Mirror Space files to Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          hf upload "$HF_REPO_ID" space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy BlockSmith from GitHub ${GITHUB_SHA}"

      - name: Wait for Space to become healthy
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          hf spaces wait "$HF_REPO_ID" --timeout 10m
          wait_status=$?
          set -e

          echo "::group::Hugging Face Space info"
          hf spaces info "$HF_REPO_ID" || true
          echo "::endgroup::"

          if [[ $wait_status -ne 0 ]]; then
            echo "::group::Hugging Face container logs (last 200 lines)"
            hf spaces logs -n 200 "$HF_REPO_ID" || true
            echo "::endgroup::"

            echo "::group::Hugging Face build logs (last 100 lines)"
            hf spaces logs --build -n 100 "$HF_REPO_ID" || true
            echo "::endgroup::"

            echo "::error::BlockSmith did not reach RUNNING. See Space logs above."
            exit $wait_status
          fi

          echo "BlockSmith: https://huggingface.co/spaces/$HF_REPO_ID"
