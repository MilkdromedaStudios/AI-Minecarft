name: Sync BlockSmith to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'space/**'
      - '.github/workflows/sync-blocksmith-space.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync Space subdirectory to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: RespawnerzStudioz/BlockSmith-Minecraft
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: space
