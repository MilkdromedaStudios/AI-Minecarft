name: Deploy BlockSmith to Hugging Face

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocksmith-huggingface-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_REPO_ID: RespawnerzStudioz/BlockSmith-Minecraft

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: space/requirements.txt

      - name: Install and test BlockSmith
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r space/requirements.txt pytest
          python -m pip install --upgrade huggingface_hub
          python -m py_compile space/app.py space/minecraft_builder.py space/modeling_builder.py space/test_builder.py
          PYTHONPATH=space pytest -q space/test_builder.py
          PYTHONPATH=space python -c "import app; print('BlockSmith Gradio app imported successfully')"

          PYTHONPATH=space python - <<'PY'
          import app
          app.demo.queue(default_concurrency_limit=1).launch(
              css=app.CSS,
              js=app.INIT_JS,
              server_name="127.0.0.1",
              server_port=7861,
              prevent_thread_lock=True,
              show_error=False,
              quiet=True,
          )
          app.demo.close()
          print("BlockSmith Gradio launch smoke test passed")
          PY

      - name: Verify Hugging Face authentication
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::Repository secret HF_TOKEN is missing."
            exit 1
          fi
          hf auth whoami

      - name: Create or configure free ZeroGPU Space
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          hf repos create "$HF_REPO_ID" \
            --repo-type space \
            --sdk gradio \
            --flavor zero-a10g \
            --public \
            --exist-ok
          hf spaces settings "$HF_REPO_ID" --hardware zero-a10g

      - name: Mirror Space files to Hugging Face
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          hf upload "$HF_REPO_ID" space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy BlockSmith from GitHub ${GITHUB_SHA}"

      - name: Wait for Space to become healthy
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from huggingface_hub import HfApi

          repo_id = os.environ["HF_REPO_ID"]
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          def dump_state(label):
              runtime = api.get_space_runtime(repo_id=repo_id)
              print(f"\n===== {label} =====")
              print(f"stage={runtime.stage}")
              print(f"hardware={runtime.hardware}")
              print(f"requested_hardware={runtime.requested_hardware}")
              print(f"raw={runtime.raw}")
              print("===== runtime logs =====")
              try:
                  lines = list(api.fetch_space_logs(repo_id=repo_id, follow=False))
                  print("".join(lines) if lines else "<no buffered runtime logs>")
              except Exception as exc:
                  print(f"Could not fetch runtime logs: {exc!r}")
              print("===== build logs =====")
              try:
                  lines = list(api.fetch_space_logs(repo_id=repo_id, build=True, follow=False))
                  print("".join(lines) if lines else "<no buffered build logs>")
              except Exception as exc:
                  print(f"Could not fetch build logs: {exc!r}")
              return runtime

          runtime = api.wait_for_space(repo_id=repo_id, timeout=600, poll_interval=2)
          if runtime.stage == "RUNNING":
              print(f"BlockSmith is RUNNING: https://huggingface.co/spaces/{repo_id}")
              sys.exit(0)

          dump_state("FIRST FAILURE")

          print("Attempting one automatic Space restart...")
          api.restart_space(repo_id=repo_id)
          runtime = api.wait_for_space(repo_id=repo_id, timeout=300, poll_interval=2)
          if runtime.stage == "RUNNING":
              print(f"BlockSmith recovered and is RUNNING: https://huggingface.co/spaces/{repo_id}")
              sys.exit(0)

          dump_state("FAILURE AFTER RESTART")
          raise SystemExit(f"BlockSmith did not reach RUNNING; final stage={runtime.stage}")
          PY
