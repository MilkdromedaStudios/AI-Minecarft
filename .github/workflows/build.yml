name: Build and Train Minecraft AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TRAIN_EPOCHS: '2'
      TRAIN_IMGSZ: '416'
      TRAIN_BATCH: '4'

    steps:
      - name: Checkout repository and LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Validate source files
        run: |
          python -m py_compile run.py train.py train_ci.py prepare_dataset.py send_control.py
          node --check controller.js
          python -m json.tool controls.json > /dev/null
          python -m json.tool control_sequences.json > /dev/null
          python -m json.tool controller.json > /dev/null
          python -m json.tool dataset_sources.json > /dev/null
          python -m json.tool package.json > /dev/null

      - name: Cache public training datasets
        uses: actions/cache@v4
        with:
          path: |
            build_data/object_source
            build_data/mob_source
          key: minecraft-training-datasets-v1

      - name: Download Minecraft-Objects gameplay dataset
        shell: bash
        run: |
          if ! find build_data/object_source -name data.yaml -print -quit 2>/dev/null | grep -q .; then
            mkdir -p build_data
            roboflow download -f yolov8 -l build_data/object_source minecraftdataset/minecraft-objects/2
          else
            echo 'Minecraft-Objects dataset restored from cache.'
          fi

      - name: Download Minecraft mob gameplay dataset
        shell: bash
        run: |
          if ! find build_data/mob_source -name data.yaml -print -quit 2>/dev/null | grep -q .; then
            python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='hmnshudhmn24/minecraft-mobs-yolo-dataset',
              repo_type='dataset',
              local_dir='build_data/mob_source',
          )
          PY
          else
            echo 'Mob dataset restored from cache.'
          fi

      - name: Merge datasets and remap classes
        run: |
          python prepare_dataset.py \
            --objects build_data/object_source \
            --mobs build_data/mob_source \
            --output build_data/merged

      - name: Train YOLO26 best.pt
        run: python train_ci.py

      - name: Verify trained model
        run: |
          test -f models/best.pt
          ls -lh models/best.pt

      - name: Store best.pt with Git LFS
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install
          git lfs track 'models/*.pt'
          git add .gitattributes models/best.pt

          if git diff --cached --quiet; then
            echo 'best.pt is unchanged.'
          else
            git commit -m 'build: update trained best.pt [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Build Windows test package
        shell: bash
        run: |
          mkdir -p dist/AI-Minecarft/models
          cp README.md LICENSE controller.js controller.json controls.json control_sequences.json dataset_sources.json \
             run.py train.py send_control.py requirements.txt package.json setup_windows.bat run_controller.bat \
             dist/AI-Minecarft/
          cp models/best.pt dist/AI-Minecarft/models/best.pt
          cd dist
          zip -r AI-Minecarft.zip AI-Minecarft

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Minecarft-Windows-Test-Package
          path: dist/AI-Minecarft.zip
          if-no-files-found: error
          retention-days: 30
